name: ci

# 什么时候跑
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python 版本必须和本地一致 —— 否则"CI 绿了本地红了"会白折腾
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 装依赖：优先用锁定的精确版本（requirements.lock），没有就用 requirements.txt
      # 锁版本的意义：CI 和本地装的是同一批版本，红/绿才有可比性
      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install pytest

      # ① 语法检查（不需要任何数据）
      #   能抓到：语法错、缩进错、括号没闭合、import 写错路径等
      - name: Syntax check
        run: python -m compileall -q backtest data main.py qa

      # ② 不依赖数据的测试
      #   注意：qa/test_acceptance.py 里那 17 个验收测试要真面板（727 MB），
      #   它们的模块级标记是 needs_data，这里会被跳过。
      #   以后新增的纯单元测试放 qa/test_unit_*.py，会自动被收集并在这里跑。
      - name: Data-free tests
        run: python -m pytest --ignore=qa/heavy -v

      # ③ 说明：需要真数据的那 15 个测试在 CI 上跑不了（数据不进仓库）。
      #    提交前请在你本机跑：python -m pytest