name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    # 钉死版本，不用 ubuntu-latest：
    # latest 会在 2026-10 迁到 Ubuntu 26 ⇒ 依赖可能装不上 ⇒ 结果不可复现
    runs-on: ubuntu-24.04

    steps:
      # v5 / v6 跑在 Node 24 上（v4 / v5 的 Node 20 已废弃，会出警告）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install pytest

      # ① 语法检查（不需要任何数据）
      # 把 .pyc 写到临时目录：否则遇到只读的 __pycache__ 会因为写不进去而报错（本地沙箱就会这样）
      - name: Syntax check
        run: python -X pycache_prefix="${RUNNER_TEMP:-/tmp}/pyc" -m compileall -q backtest data main.py qa

      # ② 不需要真实数据的测试：qa/ 下 19 条（16 纯函数 + 3 静态守门）
      #    qa/heavy/ 要读 727 MB 面板，数据不进仓库 ⇒ 显式忽略
      #    注意：别用 pytest.ini 的 norecursedirs —— 它会连显式路径也挡掉 ✗
      - name: Data-free tests
        run: python -m pytest --ignore=qa/heavy -v

      # ③ 需要真面板的 19 条（qa/heavy/）在 CI 上跑不了。
      #    提交前请在本机跑：python -m pytest