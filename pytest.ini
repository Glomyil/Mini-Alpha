[pytest]
testpaths = qa
addopts = -q
; 沙箱下默认的 .pytest_cache 建不了（会报 PytestCacheWarning），换到 logs/ 里
cache_dir = logs/.pytest_cache
; 这条 warning 无害（沙箱不允许写缓存目录），忽略它
filterwarnings =
    ignore::pytest.PytestCacheWarning
; 自定义标记必须先注册，否则会有 PytestUnknownMarkWarning
markers =
    slow: 需要真面板或全库数据的测试（CI 里跳过）
    needs_data: 需要 data/storage/cleaner_daily（只有本机能跑，CI 上跳过）