# ============================================================
# Mini-Alpha 配置
# ============================================================
# 铁律：键值对顶格写，冒号后面加空格；层级用两空格缩进
# 命名：模块.参数（ASCII 点号键），代码通过 config.get('stock.fetch.xxx') 读取
#
# 2026-10-23 清理：删掉了 2026 年早期手写的一批测试键
#   （一个带荒唐数字的 app_name、一个不存在的起始日期、一百六十万并发、
#     一个离谱的手续费率，以及 ETF池 / 调试模式 / 退出程序 / 风控-* 两行）
#   它们没有任何代码在读；但 app_name 会被 config_check() 打印进日志。
#   原始内容见 .tmp/application.yml.bak（本机）与 git 历史。

app_name: Mini-Alpha

# ============================================================
# 数据获取
# ============================================================
stock:
  fetch:
    # 行情起始日期（与 ETF 数据区间对齐，2026-09-07 用户确认）
    start_date: "2015-01-01"
    # 并发进程数（baostock 官方规则：禁止并发连接访问 → 恒为 1，串行下载）
    workers: 1
    # 数据源: baostock，落盘 = 不复权价 + 官方后复权因子
    #   hfq 价 = close × back_adj_factor（因子仅在除息/折算日变化）

# ============================================================
# 数据清洗参数（当前全部走类默认值，需要覆盖时再取消注释）
# ============================================================
# 每项都写在各模块的类属性 DEFAULT_PARAMS 里；此处只覆盖研究员想改的。
# 所有阈值上线前必须用历史数据回测验证；不确定的填 null。
#
# cleaner:
#   classifier:
#     enabled: true                   # 是否启用资产类别筛选
#     include_types: [equity]         # equity/qdii/bond/commodity/money_market
#     force_refresh: false            # true = 跳过缓存，强制重新调用 baostock
#     use_cache: true                 # 优先读 data/reference/etf_classification.json
#   suspension:
#     max_consecutive_nan: 20         # TODO: 需要回测验证 — A股ETF停牌通常≤20交易日
#   adjust:
#     ex_dividend_threshold: 0.03     # TODO: 需要回测验证 — 除权日价格跳空阈值
#     volume_change_limit: 0.50       # TODO: 需要回测验证 — 除权日成交量变化上限
#   price:
#     daily_limit: 0.10               # TODO: 需要回测验证 — A股主板涨跌幅上限
#   survivorship:
#     min_history_days: 240           # TODO: 需要回测验证 — A股交易日约240天/年
#   derived:
#     volatility_window: 20           # TODO: 需要回测验证 — 波动率滚动窗口
#     volume_ma_window: 20            # TODO: 需要回测验证 — 成交量均线窗口
#
# 股票 cleaner 参数（涨跌停分池 10%/20%/5%、停牌判定改 tradestatus、ST 标记）
# 待 T-2.1 派生涨跌停字段时再细化，见 ROADMAP_v1.md


# ============================================================
# 研究口径（RunSpec 的来源；此处留空则用代码默认值）
# ============================================================
research:
  since: 2016                 # 回测自身起始年份
  split: "2020-08-31"         # 分段分界点：空 = 不分段；单个日期 = 两段；逗号分隔 = N 段
                              # 例子："2020-08-31" 或 "2020-08-31,2023-04-10"
  freq: "ME"              # 调仓频率：ME = 月末 · QE = 季末 · W-FRI = 每周最后一个交易日，输入本身以字符串的形式作为识别标记请不要随意增加空格
                        
  borrow_cost: 0.08           # 融券年化费率（A 股约 8~10%，用于「多空净年化」那一栏）
  fee_buy: 0.00025            # 买入手续费率（默认万分之二十五）
  fee_sell: 0.00075           # 卖出手续费率（默认万分之七十五）
  slippage: 0.0005            # 滑点（默认万分之五）
  n_layers: 5               # 层数
  trading_days: 244          # 年交易日数（日历口径，与调仓频率无关：A 股 244 / 美股 252）
                             
  init_cash: 1.0              # 初始资金（等比缩放）

#————————因子中性化开关和自定义选项——————————#

  neutralize:
     enabled: false                     # 总开关；true 时 fingerprint 追加 5 段
     exposures: [industry, ln_float_mv]  # 要剥离的暴露项
     mv_floor: 0.0                       # float_mv 下限（元），0 = 不设
     weight: null                        # null = 等权；float_mv = 市值加权
     drop_first: true                    # 行业哑变量去掉一列

  # 股票池口径：是否包含 ST。true = 含（默认，与历史台账一致）；false = 剔除
  #   剔除是【因子值前置操作】：ST 的因子值置 NaN ⇒ 不进中性化/不进权重/不进 IC/不进报告
  #   注意：不改 can_trade —— 那是市场事实（停牌/涨跌停）；ST 是股票池口径，两件事
  include_st: true
